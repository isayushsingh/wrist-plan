<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>WristPlan check</title>
<!-- Diagnostic page for the watch browser: open <site>/check.html and read out the three results. -->
<style>
  html, body { background: #000; color: #f5f5f7; margin: 0; }
  body { font: 6.5vw/1.3 -apple-system, system-ui, sans-serif; padding: 4vw 5vw 8vw; }
  h1 { font-size: 5vw; letter-spacing: .12em; text-transform: uppercase; color: #8e8e93; margin: 1vw 0 4vw; font-weight: 600; }
  .row { background: #141416; border-radius: 5vw; padding: 3.5vw 4vw; margin-bottom: 2.5vw; }
  .k { color: #8e8e93; font-size: 4.6vw; }
  .v { font-weight: 700; font-size: 6.4vw; }
  .ok { color: #c7f464; } .bad { color: #ff6b6b; }
  video { width: 30vw; height: 30vw; display: block; margin-top: 2vw; background: #111; border-radius: 3vw; }
  .note { color: #636366; font-size: 4vw; margin-top: 3vw; text-align: center; }
</style>
</head>
<body>
<h1>WristPlan check</h1>
<div class="row"><div class="k">Inline video</div><div class="v" id="video">testing…</div><video id="vid" muted playsinline webkit-playsinline loop autoplay preload="auto"></video></div>
<div class="row"><div class="k">Timer speed (want ~12 fps)</div><div class="v" id="timer">testing…</div></div>
<div class="row"><div class="k">Frame download (37 frames)</div><div class="v" id="net">waiting…</div></div>
<div class="note" id="note"></div>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function set(id, text, good) { $(id).textContent = text; $(id).className = 'v ' + (good ? 'ok' : 'bad'); }
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'plan.json?t=' + Date.now(), true);
  xhr.onload = function () {
    var plan; try { plan = JSON.parse(xhr.responseText); } catch (e) { $('note').textContent = 'plan.json unreadable'; return; }
    var id = null, k;
    for (k in (plan.animVideo || {})) { id = k; break; }
    if (!id) for (k in (plan.anim || {})) { id = k; break; }
    if (!id) { $('note').textContent = 'No animations in plan.json'; return; }
    var ver = (plan.animVer && plan.animVer[id]) || '';
    var ext = (plan.animExt && plan.animExt[id]) || 'png';
    $('note').textContent = 'Tested with exercise ' + id;

    // 1. video: does it actually advance?
    var v = $('vid'), t0 = Date.now(), decided = false;
    v.muted = true;
    if (plan.animVideo && plan.animVideo[id]) {
      v.src = 'anim/' + id + '/loop.mp4?v=' + ver;
      var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
      (function poll() {
        setTimeout(function () {
          if (decided) return;
          if (v.currentTime > 0.05) { decided = true; set('video', 'Plays ✓', true); return; }
          if (Date.now() - t0 > 12000) { decided = true; set('video', 'Doesn’t play (state ' + v.readyState + ')', false); return; }
          poll();
        }, 500);
      })();
    } else set('video', 'No video in plan', false);

    // 2. timer: how many 83 ms ticks fit in 3 s
    var ticks = 0, ts = Date.now();
    (function tick() {
      ticks++;
      if (Date.now() - ts < 3000) setTimeout(tick, 83);
      else { var fps = ticks / ((Date.now() - ts) / 1000); set('timer', fps.toFixed(1) + ' fps', fps > 9); }
    })();

    // 3. network: time to download every frame of one exercise
    var n = (plan.anim[id] || []).length, loaded = 0, failed = 0, nt = Date.now();
    $('net').textContent = '0 / ' + n;
    for (var i = 0; i < n; i++) {
      var im = new Image();
      im.onload = im.onerror = function (e) {
        if (e && e.type === 'error') failed++;
        loaded++;
        $('net').textContent = loaded + ' / ' + n;
        if (loaded === n) { var s = (Date.now() - nt) / 1000; set('net', s.toFixed(1) + ' s' + (failed ? ' (' + failed + ' failed)' : ''), s < 4 && !failed); }
      };
      im.src = 'anim/' + id + '/' + i + '.' + ext + '?check=' + nt;
    }
  };
  xhr.onerror = function () { $('note').textContent = 'Couldn’t load plan.json'; };
  xhr.send();
})();
</script>
</body>
</html>
