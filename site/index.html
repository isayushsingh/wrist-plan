<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WristPlan</title>
<style>
  :root {
    --bg: #000;
    --fg: #f5f5f7;
    --dim: #8e8e93;
    --faint: #2c2c2e;
    --mute: #48484a;
    --card: #141416;
    --card-hi: #1e1e21;
    --accent: #c7f464;
    --accent-ink: #10140a;
    --accent-wash: #12160b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--fg); height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Rounded", "SF Pro Text", system-ui, sans-serif;
    font-size: 7vw; line-height: 1.2;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; -webkit-appearance: none; }
  svg { display: block; }

  .screen { display: none; min-height: 100vh; padding: 4vw 5vw 7vw; }
  .screen.on { display: block; -webkit-animation: fade .22s ease-out; animation: fade .22s ease-out; }
  @-webkit-keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- home ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 1vw 1.5vw 4vw; }
  .logo { font-size: 4.8vw; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .logo i { display: inline-block; width: 2.2vw; height: 2.2vw; border-radius: 50%; background: var(--accent); margin-right: 2vw; vertical-align: .3vw; }
  .when { font-size: 4.8vw; font-weight: 600; color: var(--dim); }

  .weeks { display: flex; background: var(--card); border-radius: 5.5vw; padding: 1vw; margin-bottom: 3vw; }
  .wk {
    flex: 1; min-width: 0; text-align: center; font-size: 4.6vw; font-weight: 600; color: var(--dim);
    padding: 1.8vw 1vw; border-radius: 4.5vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    -webkit-transition: background .15s, color .15s; transition: background .15s, color .15s;
  }
  .wk.on { background: #2c2c2e; color: var(--fg); }
  .wk i { display: inline-block; width: 1.6vw; height: 1.6vw; border-radius: 50%; background: var(--accent); margin-right: 1.4vw; vertical-align: .5vw; }

  .day {
    display: flex; align-items: center; width: 100%;
    background: var(--card); border-radius: 6.5vw;
    padding: 3.6vw 3.8vw 3.6vw 3.4vw; margin-bottom: 2.4vw;
    -webkit-transition: -webkit-transform .12s ease, background .12s ease;
    transition: transform .12s ease, background .12s ease;
  }
  .day:active { background: var(--card-hi); -webkit-transform: scale(.97); transform: scale(.97); }
  .num {
    flex: none; width: 9vw; height: 9vw; line-height: 9vw; border-radius: 50%;
    background: var(--faint); color: var(--dim); text-align: center;
    font-size: 4.6vw; font-weight: 700; margin-right: 3.4vw; font-variant-numeric: tabular-nums;
  }
  .txt { flex: 1; min-width: 0; }
  .t { display: block; font-size: 7vw; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { display: block; font-size: 4.6vw; color: var(--dim); margin-top: .5vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s b { color: var(--accent); font-weight: 600; }
  .chev { flex: none; width: 2.8vw; height: 4.6vw; margin-left: 2vw; color: var(--mute); }
  .day.next { background: var(--accent-wash); box-shadow: inset 0 0 0 .6vw var(--accent); }
  .day.next .num { background: var(--accent); color: var(--accent-ink); }
  .day.next .chev { color: var(--accent); }
  .day.empty { opacity: .45; }
  .day.empty:active { -webkit-transform: none; transform: none; }

  .credit { font-size: 3.8vw; color: var(--mute); text-align: center; margin-top: 4.5vw; line-height: 1.4; }
  .credit .off { color: var(--dim); }
  .msg { color: var(--dim); font-size: 6vw; text-align: center; padding: 18vw 4vw; line-height: 1.4; }

  /* ---------- exercise ---------- */
  #ex { display: none; flex-direction: column; height: 100vh; padding-top: 3vw; padding-bottom: 4vw; overflow: hidden; }
  #ex.on { display: flex; }
  .bar { position: relative; z-index: 3; display: flex; align-items: center; flex: none; margin-bottom: 3vw; }
  .back {
    flex: none; width: 9vw; height: 9vw; border-radius: 50%; background: var(--card);
    display: flex; align-items: center; justify-content: center; margin-right: 3vw; color: var(--accent);
  }
  .back:active { background: var(--card-hi); }
  .back svg { width: 2.8vw; height: 4.6vw; }
  .segs { flex: 1; display: flex; }
  .segs i {
    flex: 1; height: 1.4vw; border-radius: 1vw; background: var(--faint); margin-left: 1vw;
    -webkit-transition: background .2s; transition: background .2s;
  }
  .segs i:first-child { margin-left: 0; }
  .segs i.done { background: #636366; }
  .segs i.cur { background: var(--accent); }

  .body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .stage { flex: none; display: flex; justify-content: center; }
  /* square, sized from the viewport height, never larger than the 180px source.
     The GIFs' backdrops are pre-darkened to #000 by the admin, so the figure sits straight on the page. */
  .tile {
    position: relative; width: 60vh; height: 60vh; max-width: 180px; max-height: 180px;
    border-radius: 7vw; overflow: hidden; background: #000;
  }
  /* one stacked 180x180 img per animation frame; JS shows one at a time (.on) */
  .tile img { position: absolute; left: 0; top: 0; display: block; width: 100%; height: 100%; visibility: hidden; }
  .tile img.on { visibility: visible; }
  .tile.loading img { visibility: hidden; }
  .tile.missing { background: var(--card); }
  .tile.missing img { visibility: hidden; }
  .tile.missing:after {
    content: "Offline"; position: absolute; left: 0; right: 0; top: 50%; margin-top: -2.5vw;
    text-align: center; font-size: 4.4vw; font-weight: 600; color: #8e8e93;
  }

  .info { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 2vw 1vw 0; min-height: 0; }
  .name {
    font-size: 8vw; font-weight: 700; line-height: 1.1; letter-spacing: -.015em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .name.long { font-size: 6.8vw; }
  .meta { font-size: 4.8vw; color: var(--dim); margin-top: 1.4vw; }
  .meta b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

  .in-next { -webkit-animation: inNext .24s ease-out; animation: inNext .24s ease-out; }
  .in-prev { -webkit-animation: inPrev .24s ease-out; animation: inPrev .24s ease-out; }
  .nudge { -webkit-animation: nudge .3s ease-out; animation: nudge .3s ease-out; }
  @-webkit-keyframes inNext { from { opacity: 0; -webkit-transform: translateX(6vw); } to { opacity: 1; -webkit-transform: none; } }
  @keyframes inNext { from { opacity: 0; transform: translateX(6vw); } to { opacity: 1; transform: none; } }
  @-webkit-keyframes inPrev { from { opacity: 0; -webkit-transform: translateX(-6vw); } to { opacity: 1; -webkit-transform: none; } }
  @keyframes inPrev { from { opacity: 0; transform: translateX(-6vw); } to { opacity: 1; transform: none; } }
  @-webkit-keyframes nudge { 30% { -webkit-transform: translateX(2.5vw); } 60% { -webkit-transform: translateX(-1vw); } }
  @keyframes nudge { 30% { transform: translateX(2.5vw); } 60% { transform: translateX(-1vw); } }

  /* invisible tap zones over everything below the top bar */
  .zone { position: fixed; top: 14vw; bottom: 0; z-index: 2; }
  .zone.prev { left: 0; width: 34%; }
  .zone.next { right: 0; width: 66%; }

  /* ---------- done ---------- */
  #done { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 100vh; }
  #done.on { display: flex; }
  .ring { width: 28vw; height: 28vw; margin-bottom: 4vw; }
  .ring circle, .ring path { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; }
  .ring circle { stroke-width: 3; stroke-dasharray: 151; stroke-dashoffset: 151; -webkit-animation: draw .5s ease-out forwards; animation: draw .5s ease-out forwards; }
  .ring path { stroke-width: 4; stroke-dasharray: 32; stroke-dashoffset: 32; -webkit-animation: draw .3s .4s ease-out forwards; animation: draw .3s .4s ease-out forwards; }
  @-webkit-keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  #done h2 { font-size: 8.5vw; font-weight: 700; letter-spacing: -.015em; line-height: 1.1; padding: 0 2vw; }
  #done .sub { color: var(--dim); font-size: 4.8vw; margin-top: 1.4vw; }
  .upnext { margin-top: 4vw; font-size: 4.6vw; color: var(--dim); background: var(--card); border-radius: 5vw; padding: 1.8vw 4vw; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .upnext b { color: var(--accent); font-weight: 600; }
  .hint { color: var(--mute); font-size: 4vw; margin-top: 4vw; }
</style>
</head>
<body>

<section id="home" class="screen on">
  <div class="top"><span class="logo"><i></i>WristPlan</span><span class="when" id="when"></span></div>
  <div class="weeks" id="weeks" style="display:none"></div>
  <div id="days"><div class="msg">Loading…</div></div>
  <div class="credit" id="credit">Animations © Gym visual</div>
</section>

<section id="ex" class="screen">
  <div class="bar">
    <button class="back" id="backBtn" aria-label="Back to days">
      <svg viewBox="0 0 6 10"><path d="M5 1L1 5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="segs" id="segs"></div>
  </div>
  <div class="body" id="body">
    <div class="stage"><div class="tile" id="tile"></div></div>
    <div class="info"><div><!-- wrapper keeps .name out of flex so line-clamp works -->
      <div class="name" id="name"></div>
      <div class="meta" id="meta"></div>
    </div></div>
  </div>
  <button class="zone prev" id="prevZone" aria-label="Previous exercise"></button>
  <button class="zone next" id="nextZone" aria-label="Next exercise"></button>
</section>

<section id="done" class="screen">
  <svg class="ring" viewBox="0 0 52 52" aria-hidden="true">
    <circle cx="26" cy="26" r="24" transform="rotate(-90 26 26)"/>
    <path d="M15 27l7 7 15-15"/>
  </svg>
  <h2 id="doneTitle">Done</h2>
  <div class="sub" id="doneSub"></div>
  <div class="upnext" id="doneNext"></div>
  <div class="hint">Tap to finish</div>
</section>

<script>
// ===== WristPlan vector exercise animations (ES5, no dependencies) =====
// A stylised figure with a 2-bone IK rig. Each movement is two key poses (A, B); the figure eases
// between them, equipment is drawn from the joints, and the target muscles glow as they contract.
// Coordinates: SVG viewBox 0..100, y down. Angles: dir(a) = (sin a, cos a): 0 = down, 90 = right,
// 180 = up, -90 = left. Side-view figures face right.
var Motion = (function () {
  var NS = 'http://www.w3.org/2000/svg', RAD = Math.PI / 180;
  var L = { torso: 25, neck: 3.4, head: 5.6, ua: 14.5, fa: 13.5, th: 18.5, sh: 18, foot: 6 };
  var T = { ua: 5.4, fa: 4.5, th: 7.6, sh: 5.7, neck: 4.2 };
  var FLOOR = 91, ANK = 87.6;
  var COL = {
    near: '#d9dce3', torso: '#cdd0d8', far: '#4b4f58', farTorso: '#4b4f58',
    mus: '#ff4f37', metal: '#8e8e93', plate: '#2f2f33', rim: '#77777e',
    pad: '#232326', padRim: '#3e3e44', floor: '#1c1c1f', cable: '#6e6e75'
  };

  function dir(a) { return [Math.sin(a * RAD), Math.cos(a * RAD)]; }
  function add(p, d, k) { return [p[0] + d[0] * k, p[1] + d[1] * k]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
  function len(v) { return Math.sqrt(v[0] * v[0] + v[1] * v[1]); }
  function unit(v) { var l = len(v) || 1; return [v[0] / l, v[1] / l]; }
  function nrm(d) { return [-d[1], d[0]]; }            // torso: +nrm = anterior (chest side)
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1]; }
  function mix(a, b, t) { return a + (b - a) * t; }
  function ease(t) { return 0.5 - 0.5 * Math.cos(Math.PI * t); }

  // two-bone IK: joint placed on the side of root→target that best matches `pref`
  function ik(root, target, a, b, pref) {
    var v = sub(target, root), d = len(v);
    var dd = Math.max(Math.abs(a - b) + 0.01, Math.min(a + b - 0.01, d));
    var u = d ? [v[0] / d, v[1] / d] : [0, 1];
    var x = (a * a + dd * dd - b * b) / (2 * dd), h = Math.sqrt(Math.max(0, a * a - x * x));
    var p = [-u[1], u[0]];
    var j1 = [root[0] + u[0] * x + p[0] * h, root[1] + u[1] * x + p[1] * h];
    var j2 = [root[0] + u[0] * x - p[0] * h, root[1] + u[1] * x - p[1] * h];
    var j = dot(p, pref) >= 0 ? j1 : j2;
    var end = add(j, unit(sub(add(root, u, dd), j)), b);
    return [j, end];
  }

  // ---------- pose solving ----------
  function solve(P, view) {
    var j = { view: view };
    j.hip = P.h;
    j.td = dir(P.t);
    j.n = nrm(j.td);
    j.sho = add(j.hip, j.td, L.torso + (P.sg || 0));
    j.head = add(j.sho, dir(P.hd != null ? P.hd : P.t), L.neck + L.head);
    j.neck = add(j.sho, dir(P.hd != null ? P.hd : P.t), L.neck * 0.6);
    var front = view !== 's';
    j.hipW = front ? 15 : 10.5;
    j.shW = front ? 22 : 13;
    if (front) {
      j.s1 = add(j.sho, j.n, j.shW / 2 - 3.4); j.s2 = add(j.sho, j.n, -(j.shW / 2 - 3.4));
      j.h1 = add(j.hip, j.n, j.hipW / 2 - 3.6); j.h2 = add(j.hip, j.n, -(j.hipW / 2 - 3.6));
    } else { j.s1 = j.s2 = j.sho; j.h1 = j.h2 = j.hip; }
    var cx = j.hip[0];
    function mirror(p) { return [2 * cx - p[0], p[1]]; }
    var a2 = P.a2 || (front ? mirror(P.a1) : P.a1);
    var l2 = P.l2 || (front ? mirror(P.l1) : P.l1);
    // elbows bend posterior (side) / outward (front); knees anterior / outward. eb/kb = ±1 flips.
    var eb1 = P.eb1 || 1, eb2 = P.eb2 || eb1, kb1 = P.kb1 || 1, kb2 = P.kb2 || kb1;
    var pe1, pe2, pk1, pk2;
    if (front) {
      pe1 = [j.n[0] * eb1, j.n[1] * eb1]; pe2 = [-j.n[0] * eb2, -j.n[1] * eb2];
      pk1 = [j.n[0] * kb1, j.n[1] * kb1]; pk2 = [-j.n[0] * kb2, -j.n[1] * kb2];
    } else {
      pe1 = [-j.n[0] * eb1, -j.n[1] * eb1]; pe2 = [-j.n[0] * eb2, -j.n[1] * eb2];
      pk1 = [j.n[0] * kb1, j.n[1] * kb1]; pk2 = [j.n[0] * kb2, j.n[1] * kb2];
    }
    var r;
    r = ik(j.s1, P.a1, L.ua, L.fa, pe1); j.e1 = r[0]; j.w1 = r[1];
    r = ik(j.s2, a2, L.ua, L.fa, pe2); j.e2 = r[0]; j.w2 = r[1];
    var th = L.th * (P.thf || 1);
    r = ik(j.h1, P.l1, th, L.sh, pk1); j.k1 = r[0]; j.an1 = r[1];
    r = ik(j.h2, l2, th, L.sh, pk2); j.k2 = r[0]; j.an2 = r[1];
    function foot(k, an, f, side) {
      var d;
      if (f != null) d = dir(f);
      else if (front) d = unit([side * 0.55, 0.85]);
      else { var s = unit(sub(an, k)); d = [s[1], -s[0]]; }   // along the shin's anterior side
      return add(an, d, front ? 3.2 : L.foot);
    }
    j.t1 = foot(j.k1, j.an1, P.f1, 1);
    j.t2 = foot(j.k2, j.an2, P.f2 != null ? P.f2 : P.f1, -1);
    return j;
  }

  function lerpPose(A, B, t) {
    var o = {}, k;
    for (k in A) if (A.hasOwnProperty(k)) o[k] = A[k];
    for (k in B) if (B.hasOwnProperty(k)) {
      var a = A[k], b = B[k];
      if (a == null) o[k] = b;
      else if (typeof a === 'number') o[k] = mix(a, b, t);
      else if (a.length === 2) o[k] = [mix(a[0], b[0], t), mix(a[1], b[1], t)];
      else o[k] = t < 0.5 ? a : b;
    }
    return o;
  }

  // ---------- shape list helpers ----------
  function L_(a, b, w, c, o) { return { k: 'line', a: a, b: b, w: w, c: c, o: o == null ? 1 : o }; }
  function C_(p, r, fill, stroke, sw) { return { k: 'circle', p: p, r: r, f: fill, s: stroke, sw: sw || 0 }; }
  function P_(pts, fill, stroke, sw) { return { k: 'poly', pts: pts, f: fill, s: stroke, sw: sw || 0 }; }

  function box(a, b, w, fill, stroke) {            // thick bar from a to b as a polygon
    var u = unit(sub(b, a)), n = [-u[1] * w / 2, u[0] * w / 2];
    return P_([[a[0] + n[0], a[1] + n[1]], [b[0] + n[0], b[1] + n[1]], [b[0] - n[0], b[1] - n[1]], [a[0] - n[0], a[1] - n[1]]], fill, stroke, 0.8);
  }
  function pad(a, b, w) { return box(a, b, w, COL.pad, COL.padRim); }
  function post(x, y1, y2) { return L_([x, y1], [x, y2], 1.6, COL.padRim); }
  function floor() { return L_([6, FLOOR], [94, FLOOR], 0.8, COL.floor); }
  function disc(p, r) { return [C_(p, r, COL.plate, COL.rim, 0.9), C_(p, Math.max(1, r * 0.22), COL.metal)]; }
  function dbSide(p) { return disc(p, 3.6); }
  function dbFront(p) {
    return [L_([p[0] - 4.2, p[1]], [p[0] + 4.2, p[1]], 1.4, COL.metal),
            L_([p[0] - 4.2, p[1] - 2.6], [p[0] - 4.2, p[1] + 2.6], 2.6, COL.plate),
            L_([p[0] + 4.2, p[1] - 2.6], [p[0] + 4.2, p[1] + 2.6], 2.6, COL.plate)];
  }
  function cable(from, to) { return [L_(from, to, 0.7, COL.cable), C_(from, 2, COL.plate, COL.rim, 0.8)]; }
  function handle(p) { return C_(p, 1.6, COL.metal); }

  // bench pad along the torso's back, offset to sit under the body
  function backPad(j, ext1, ext2, off) {
    var post_ = [-j.n[0], -j.n[1]], o = off || 6.6;
    var a = add(add(j.hip, j.td, -(ext1 || 6)), post_, o), b = add(add(j.sho, j.td, ext2 || 3), post_, o);
    return pad(a, b, 4);
  }
  function seat(j, x1, x2, y) { return pad([x1, y], [x2, y], 4); }

  // equipment held in the hands, by equipment type
  function held(j, eq, view) {
    var out = [];
    function each(fn) { out = out.concat(fn(j.w1)); if (view !== 's') out = out.concat(fn(j.w2)); }
    if (eq === 'bb') {
      if (view === 's') out = out.concat(disc(j.w1, 7.6));
      else {
        out.push(L_([j.w2[0] - 9, j.w2[1]], [j.w1[0] + 9, j.w1[1]], 1.4, COL.metal));
        out = out.concat([L_([j.w2[0] - 8, j.w2[1] - 6], [j.w2[0] - 8, j.w2[1] + 6], 3, COL.plate),
                          L_([j.w1[0] + 8, j.w1[1] - 6], [j.w1[0] + 8, j.w1[1] + 6], 3, COL.plate)]);
      }
    } else if (eq === 'db' || eq === 'kb') each(view === 's' ? dbSide : dbFront);
    return out;
  }

  // ---------- muscles ----------
  // side view: [segment, 'a'nterior/'p'osterior/'c'enter, from, to, width×thickness, offset×thickness]
  var MUS_S = {
    chest: [['torso', 'a', 0.64, 0.93, 0.36, 0.3]],
    abs: [['torso', 'a', 0.12, 0.58, 0.3, 0.33]],
    lats: [['torso', 'p', 0.42, 0.86, 0.36, 0.3]],
    traps: [['torso', 'p', 0.82, 1.02, 0.34, 0.26], ['neck', 'p', 0, 0.9, 0.5, 0.2]],
    lowerback: [['torso', 'p', 0.06, 0.4, 0.3, 0.33]],
    delts: [['ua', 'c', 0.02, 0.3, 1.05, 0]],
    biceps: [['ua', 'a', 0.3, 0.82, 0.55, 0.22]],
    triceps: [['ua', 'p', 0.24, 0.84, 0.55, 0.22]],
    forearms: [['fa', 'a', 0.1, 0.55, 0.55, 0.2]],
    glutes: [['th', 'p', -0.06, 0.3, 0.7, 0.2]],

    eq: function (j, eq) { return { back: [floor()], front: held(j, eq, 's') }; }
  });
  def('bridge', 'Glute bridge', {
    v: 's', sq: 'B', dur: [300, 800, 400, 900],
    A: { h: [52, 85], t: -90, hd: -92, a1: [52, 79], l1: [70, ANK] },
    B: { h: [50, 72.5], t: -62, hd: -96, a1: [50, 66] },
    eq: function (j, eq) {
      var out = eq === 'bb' ? disc(add(j.hip, j.n, 6.5), 7) : [];
      return { back: [floor()], front: out };
    }
  });
  def('hangraise', 'Hanging leg raise', {
    v: 's', sq: 'B', dur: [300, 900, 300, 1000],
    A: { h: [50, 58], t: 180, a1: [51, 6], l1: [50, 94] },
    B: { l1: [85, 55] },
    eq: function () { return { back: [L_([30, 5.5], [72, 5.5], 1.4, COL.padRim), C_([51, 5.5], 2.2, COL.metal)], front: [] }; }
  });
  def('crunch', 'Crunch', {
    v: 's', sq: 'B', dur: [300, 700, 300, 800],
    A: { h: [56, 85], t: -90, hd: -95, a1: [41, 79.5], l1: [72, ANK] },
    B: { t: -116, hd: -136, a1: [43, 71] },
    eq: function () { return { back: [floor()], front: [] }; }
  });
  def('deadbug', 'Dead bug', {
    v: 's', sq: 'B', dur: [300, 900, 300, 900],
    A: { h: [58, 85], t: -90, hd: -92, a1: [37, 58], a2: [37, 58], l1: [78, 66], l2: [78, 66] },
    B: { a1: [10, 79], l2: [93, 79] },
    eq: function () { return { back: [floor()], front: [] }; }
  });
  def('twist', 'Russian twist', {
    v: 'f', sq: 'B', dur: [200, 650, 200, 650],
    A: { h: [50, 74], t: 172, a1: [37, 66], a2: [40, 68], l1: [63, 89], l2: [37, 89] },
    B: { t: 188, a1: [60, 76], a2: [63, 74] },
    eq: function (j) {
      return { back: [floor()], front: disc([(j.w1[0] + j.w2[0]) / 2, (j.w1[1] + j.w2[1]) / 2], 4.2) };
    }
  });
  def('plank', 'Plank', {
    v: 's', sq: 'B', dur: [600, 1200, 600, 1200],
    A: { h: [44, 76.5], t: 100, hd: 104, a1: [82, 88.5], eb1: -1, l1: [8, 89] },
    B: { h: [44, 75.5] },
    eq: function () { return { back: [floor()], front: [] }; }
  });
  def('pushup', 'Push-up', {
    v: 's', sq: 'A', dur: [300, 900, 250, 900],
    A: { h: [42, 72], t: 115, hd: 118, a1: [66, 88.5], l1: [6, 89.5] },
    B: { h: [41, 82], t: 97, hd: 100 },
    eq: function () { return { back: [floor()], front: [] }; }
  });
  def('dip', 'Dip', {
    v: 's', sq: 'A', dur: [300, 900, 250, 900],
    A: { h: [48, 54], t: 178, a1: [52, 55], l1: [40, 86] },
    B: { h: [49, 67], t: 164, hd: 170, a1: [52, 55] },
    eq: function () { return { back: [L_([52, 57], [52, FLOOR], 1.6, COL.padRim), C_([52, 56.5], 2, COL.metal), floor()], front: [] }; }
  });

  // ---------- renderer ----------
  function el(tag) { return document.createElementNS(NS, tag); }
  function Renderer(svg) { this.svg = svg; this.pool = []; }
  Renderer.prototype.draw = function (list) {
    var pool = this.pool, svg = this.svg, i;
    for (i = 0; i < list.length; i++) {
      var s = list[i], e = pool[i];
      if (!e || e._k !== s.k) {
        var ne = el(s.k === 'poly' ? 'polygon' : s.k);
        ne._k = s.k;
        if (s.k === 'line') ne.setAttribute('stroke-linecap', 'round');
        if (s.k === 'poly') ne.setAttribute('stroke-linejoin', 'round');
        if (e) svg.replaceChild(ne, e); else svg.appendChild(ne);
        pool[i] = e = ne;
      }
      e.style.display = '';
      if (s.k === 'line') {
        e.setAttribute('x1', s.a[0].toFixed(2)); e.setAttribute('y1', s.a[1].toFixed(2));
        e.setAttribute('x2', s.b[0].toFixed(2)); e.setAttribute('y2', s.b[1].toFixed(2));
        e.setAttribute('stroke', s.c); e.setAttribute('stroke-width', s.w.toFixed(2)); e.setAttribute('stroke-opacity', s.o.toFixed(2));
      } else if (s.k === 'circle') {
        e.setAttribute('cx', s.p[0].toFixed(2)); e.setAttribute('cy', s.p[1].toFixed(2)); e.setAttribute('r', s.r.toFixed(2));
        e.setAttribute('fill', s.f); e.setAttribute('stroke', s.s || 'none'); e.setAttribute('stroke-width', s.sw);
      } else {
        var pts = '';
        for (var k = 0; k < s.pts.length; k++) pts += s.pts[k][0].toFixed(2) + ',' + s.pts[k][1].toFixed(2) + ' ';
        e.setAttribute('points', pts); e.setAttribute('fill', s.f); e.setAttribute('stroke', s.s || 'none'); e.setAttribute('stroke-width', s.sw);
      }
    }
    for (; i < pool.length; i++) pool[i].style.display = 'none';
  };

  function frame(spec, opts, p) {
    var P = lerpPose(spec.A, spec.B, p);
    if (spec.init) spec.init(P);
    var view = spec.v, j = solve(P, view);
    var c = spec.sq === 'A' ? 1 - p : p;
    var eq = spec.eq ? spec.eq(j, opts.eq || 'bw') : { back: [], front: [] };
    var b = body(j, { p: opts.p || [], s: opts.s || [] }, c);
    // order: equipment behind, far limbs, torso + head, muscles on torso, near limbs, limb muscles, held equipment
    return [].concat(eq.back, b.back, b.near, eq.front);
  }

  // phase 0..1 over a full cycle → eased pose position 0..1 (A→B→A)
  function phasePos(spec, t) {
    var d = spec.dur, total = d[0] + d[1] + d[2] + d[3];
    t = t % total;
    if (t < d[0]) return 0;
    t -= d[0]; if (t < d[1]) return ease(t / d[1]);
    t -= d[1]; if (t < d[2]) return 1;
    t -= d[2]; return 1 - ease(t / d[3]);
  }

  function mount(container, key, opts) {
    var spec = M[key];
    var svg = el('svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    // soft top-lit shading for the torso
    var defs = el('defs'), g = el('linearGradient'), s1 = el('stop'), s2 = el('stop');
    g.setAttribute('id', 'wpShade'); g.setAttribute('x1', '0'); g.setAttribute('y1', '0'); g.setAttribute('x2', '0.35'); g.setAttribute('y2', '1');
    s1.setAttribute('offset', '0'); s1.setAttribute('stop-color', '#e6e8ee');
    s2.setAttribute('offset', '1'); s2.setAttribute('stop-color', '#aeb2bc');
    g.appendChild(s1); g.appendChild(s2); defs.appendChild(g); svg.appendChild(defs);
    svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%');
    container.appendChild(svg);
    var r = new Renderer(svg), timer = null, t0 = 0;
    function render(p) { r.draw(frame(spec, opts || {}, p)); }
    function tick() {
      render(phasePos(spec, Date.now() - t0));
      timer = setTimeout(tick, 33);
    }
    render(0);
    return {
      start: function () { if (!timer) { t0 = Date.now(); tick(); } },
      stop: function () { if (timer) clearTimeout(timer); timer = null; },
      render: render
    };
  }

  return { has: function (k) { return !!M[k]; }, list: M, mount: mount };
})();
</script>
<script>
(function () {
  var KEY_PLAN = 'wp.plan', KEY_LAST = 'wp.lastDay';
  var WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var CHEV = '<svg class="chev" viewBox="0 0 6 10"><path d="M1 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

  var plan = null, planText = null, offline = false;
  var viewWk = -1; // week shown on home; -1 = follow the calendar
  var day = null, dayIdx = -1, idx = 0, lockUntil = 0, keep = [];

  function current() {
    var ids = ['home', 'ex', 'done'];
    for (var i = 0; i < ids.length; i++) if ($(ids[i]).classList.contains('on')) return ids[i];
    return 'home';
  }
  function show(id) {
    var ids = ['home', 'ex', 'done'];
    for (var i = 0; i < ids.length; i++) {
      if (ids[i] === id) $(ids[i]).classList.add('on'); else $(ids[i]).classList.remove('on');
    }
    window.scrollTo(0, 0);
  }
  function replay(el, cls) {
    el.classList.remove('in-next'); el.classList.remove('in-prev'); el.classList.remove('nudge');
    void el.offsetWidth; // restart the CSS animation
    el.classList.add(cls);
  }

  // Weeks rotate A, B, A, B… every Monday, counted from plan.weekAnchor (a Monday that starts week 1).
  function currentWeek() {
    var n = plan.weeks.length, p = String(plan.weekAnchor || '').split('-');
    if (n < 2 || p.length !== 3) return 0;
    var a = new Date(+p[0], +p[1] - 1, +p[2]), now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var w = Math.floor(Math.round((today - a) / 864e5) / 7); // round() absorbs DST hour shifts
    return ((w % n) + n) % n;
  }
  function shownWeek() { return viewWk >= 0 && viewWk < plan.weeks.length ? viewWk : currentWeek(); }
  function days() { return plan.weeks[shownWeek()].days; }

  function nextDayIndex(list) {
    var last = store.get(KEY_LAST), lastIdx = -1;
    for (var i = 0; i < list.length; i++) if (list[i].id === last) lastIdx = i;
    return lastIdx === -1 ? 0 : (lastIdx + 1) % list.length;
  }

  function renderWeeks() {
    var box = $('weeks'), n = plan.weeks.length, cur = currentWeek(), shown = shownWeek();
    box.style.display = n > 1 ? '' : 'none';
    if (n < 2) return;
    box.innerHTML = '';
    for (var w = 0; w < n; w++) {
      var b = document.createElement('button');
      b.className = 'wk' + (w === shown ? ' on' : '');
      b.innerHTML = (w === cur ? '<i></i>' : '') + esc(plan.weeks[w].name);
      b.onclick = (function (k) { return function () { viewWk = k; renderHome(); }; })(w);
      box.appendChild(b);
    }
  }

  function renderHome() {
    $('when').textContent = WEEKDAYS[new Date().getDay()];
    $('credit').innerHTML = (offline ? '<span class="off">Offline · saved plan</span><br>' : '') + 'Animations © Gym visual';
    var box = $('days');
    if (!plan || !plan.weeks.length) {
      $('weeks').style.display = 'none';
      box.innerHTML = '<div class="msg">No plan yet.<br>Add days in the admin portal.</div>';
      return;
    }
    renderWeeks();
    var list = days();
    if (!list.length) {
      box.innerHTML = '<div class="msg">No days in ' + esc(plan.weeks[shownWeek()].name) + ' yet.</div>';
      return;
    }
    // "Up next" only makes sense for the week we're actually in
    var ni = shownWeek() === currentWeek() ? nextDayIndex(list) : -1;
    box.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      var d = list[i], n = d.exercises.length;
      var b = document.createElement('button');
      b.className = 'day' + (i === ni ? ' next' : '') + (n ? '' : ' empty');
      b.innerHTML =
        '<span class="num">' + (i + 1) + '</span>' +
        '<span class="txt"><span class="t">' + esc(d.name) + '</span><span class="s">' +
        (n ? (i === ni ? '<b>Up next</b> · ' : '') + plural(n, 'exercise') : 'No exercises') +
        '</span></span>' + CHEV;
      b.onclick = (function (k) { return function () { openDay(k); }; })(i);
      box.appendChild(b);
    }
  }

  function frameSrc(id, n) { return 'anim/' + id + '/' + n + '.png' + (plan.animV ? '?v=' + encodeURIComponent(plan.animV) : ''); }
  function delaysOf(id) { return (plan.anim && plan.anim[id]) || [1000]; }

  // Frame player. Watch browsers may not animate GIFs, and watchOS downsamples large images, so each
  // frame is its own small PNG; all of them sit stacked in the tile and setTimeout flips which is visible.
  // player.vec is set instead when the exercise is drawn as a vector movement (Motion, above).
  var player = { timer: null, frame: 0, delays: [], imgs: [], id: null, vec: null };
  function stopAnim() {
    if (player.timer) clearTimeout(player.timer);
    player.timer = null;
    if (player.vec) player.vec.stop();
  }
  function showFrame(n) {
    player.imgs[player.frame].className = '';
    player.frame = n;
    player.imgs[n].className = 'on';
  }
  function stepAnim() {
    var n = (player.frame + 1) % player.imgs.length, im = player.imgs[n];
    if (!im.complete || !im.naturalWidth) { player.timer = setTimeout(stepAnim, 120); return; } // still loading
    showFrame(n);
    player.timer = setTimeout(stepAnim, player.delays[n]);
  }
  function playAnim() {
    stopAnim();
    if (player.vec) { player.vec.start(); return; }
    if (!player.imgs.length) return;
    showFrame(0);
    if (player.imgs.length > 1) player.timer = setTimeout(stepAnim, player.delays[0]);
  }
  function loadAnim(id) {
    stopAnim();
    var tile = $('tile'), delays = delaysOf(id);
    tile.innerHTML = ''; tile.classList.add('loading'); tile.classList.remove('missing');
    player.id = id; player.delays = delays; player.imgs = []; player.frame = 0; player.vec = null;
    for (var n = 0; n < delays.length; n++) {
      var im = document.createElement('img');
      im.alt = '';
      im.src = frameSrc(id, n);
      tile.appendChild(im); player.imgs.push(im);
    }
    var first = player.imgs[0];
    function ready() { if (player.id === id) { tile.classList.remove('loading'); playAnim(); } }
    if (first.complete && first.naturalWidth) ready();
    else {
      first.onload = ready;
      first.onerror = function () { if (player.id === id) { tile.classList.remove('loading'); tile.classList.add('missing'); } };
    }
  }

  // Vector movement for an exercise, or null to use the PNG frames. x.mo is a per-exercise override
  // set in the admin: a movement key, or 'gif' for the original animation.
  function motionKey(x) {
    if (x.mo === 'gif') return null;
    var k = x.mo || (plan.motion && plan.motion[x.id] && plan.motion[x.id].m);
    return k && Motion.has(k) ? k : null;
  }
  function loadVector(x, key) {
    stopAnim();
    var tile = $('tile'), info = (plan.motion && plan.motion[x.id]) || {};
    tile.innerHTML = ''; tile.classList.remove('loading'); tile.classList.remove('missing');
    player.id = 'v:' + x.id + ':' + key; player.imgs = [];
    player.vec = Motion.mount(tile, key, { eq: info.eq, p: info.p || [], s: info.s || [] });
    player.vec.start();
  }

  function openDay(i) {
    var d = days()[i];
    if (!d.exercises.length) return;
    day = d; dayIdx = i; idx = 0;
    store.set(KEY_LAST, d.id);
    var segs = '';
    for (var j = 0; j < d.exercises.length; j++) segs += '<i></i>';
    $('segs').innerHTML = segs;
    renderEx(0);
    show('ex');
    // preload the whole day so it keeps working if the connection drops mid-workout
    keep = [];
    for (var k = 1; k < d.exercises.length; k++) {
      if (motionKey(d.exercises[k])) continue; // vectors need no download
      var id = d.exercises[k].id, nf = delaysOf(id).length;
      for (var f = 0; f < nf; f++) { var im = new Image(); im.src = frameSrc(id, f); keep.push(im); }
    }
  }

  function renderEx(dir) {
    var x = day.exercises[idx], key = motionKey(x);
    if (player.id !== (key ? 'v:' + x.id + ':' + key : x.id)) { if (key) loadVector(x, key); else loadAnim(x.id); }
    else playAnim();
    var label = x.label || x.id;
    $('name').textContent = label;
    $('name').className = 'name' + (label.length > 22 ? ' long' : '');
    $('meta').innerHTML = esc(day.name) + ' · <b>' + (idx + 1) + ' of ' + day.exercises.length + '</b>';
    var segs = $('segs').children;
    for (var i = 0; i < segs.length; i++) segs[i].className = i < idx ? 'done' : (i === idx ? 'cur' : '');
    if (dir) replay($('body'), dir > 0 ? 'in-next' : 'in-prev');
  }

  function finish() {
    var n = day.exercises.length;
    $('doneTitle').textContent = day.name + ' done';
    $('doneSub').textContent = plural(n, 'exercise');
    // next session: the following day this week, or the first day of the next week
    var list = days(), nd = null, label = 'Next';
    if (dayIdx < list.length - 1) nd = list[dayIdx + 1];
    else if (plan.weeks.length > 1) {
      var nw = plan.weeks[(shownWeek() + 1) % plan.weeks.length];
      nd = nw.days[0] || null; label = esc(nw.name);
    } else if (list.length > 1) nd = list[0];
    $('doneNext').style.display = nd ? '' : 'none';
    if (nd) $('doneNext').innerHTML = label + ' · <b>' + esc(nd.name) + '</b>';
    lockUntil = Date.now() + 600; // ignore the tap that got us here
    stopAnim();
    show('done');
  }

  function next() {
    if (idx < day.exercises.length - 1) { idx++; renderEx(1); } else finish();
  }
  function prev() {
    if (idx > 0) { idx--; renderEx(-1); } else replay($('body'), 'nudge'); // first exercise: use ‹ to leave
  }
  function goHome() { stopAnim(); renderHome(); show('home'); }

  $('nextZone').onclick = next;
  $('prevZone').onclick = prev;
  $('backBtn').onclick = goHome;
  $('done').onclick = function () { if (Date.now() > lockUntil) goHome(); };

  // swipe left / right on the exercise screen
  var sx = null, sy = null;
  $('ex').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, false);
  $('ex').addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { if (dx < 0) next(); else prev(); }
  }, false);

  // arrow keys, handy when testing on a laptop
  document.addEventListener('keydown', function (e) {
    var k = e.keyCode, s = current();
    if (s === 'ex') { if (k === 39 || k === 32) next(); else if (k === 37) prev(); else if (k === 27) goHome(); }
    else if (s === 'done' && (k === 13 || k === 27 || k === 32)) goHome();
  }, false);

  // plan: show the cached copy instantly, then refresh from the network
  function apply(txt) {
    var p = JSON.parse(txt);
    if (p && !p.weeks && p.days) p.weeks = [{ id: 'A', name: 'Week A', days: p.days }]; // v1 plan
    if (!p || !p.weeks) throw new Error('bad plan');
    plan = p; planText = txt;
  }
  function load() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'plan.json?t=' + Date.now(), true);
    xhr.onload = function () {
      if (xhr.status !== 200) return xhr.onerror();
      try {
        var changed = xhr.responseText !== planText;
        if (changed) { apply(xhr.responseText); store.set(KEY_PLAN, xhr.responseText); }
        var wasOffline = offline;
        offline = false;
        // re-render only on the home screen, so a workout in progress isn't disturbed
        if (current() === 'home' && (changed || wasOffline)) renderHome();
      } catch (e) { xhr.onerror(); }
    };
    xhr.onerror = function () {
      if (plan) { offline = true; if (current() === 'home') renderHome(); }
      else $('days').innerHTML = '<div class="msg">Couldn’t load plan.<br>Check connection.</div>';
    };
    xhr.send();
  }

  var cached = store.get(KEY_PLAN);
  if (cached) { try { apply(cached); renderHome(); } catch (e) {} }
  load();

  // refresh when the page comes back to the foreground (wrist raise, reopening the browser)
  // and pause the animation while hidden, resuming on the same exercise
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stopAnim(); return; }
    if (current() === 'home') { viewWk = -1; load(); renderHome(); }
    else if (current() === 'ex' && day) playAnim();
  }, false);
})();
</script>
</body>
